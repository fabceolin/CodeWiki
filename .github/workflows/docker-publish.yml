name: Build and Publish Docker Image

on:
  push:
    branches:
      - development
      - main
    paths:
      - 'codewiki/**'
      - 'docker/Dockerfile.runner'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/docker-publish.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: latest)'
        required: false
        default: 'latest'
      no_cache:
        description: 'Build without cache (true/false)'
        required: false
        default: 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/codewiki-runner

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -E '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "CodeWiki version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # For push to development branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/development' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/development' }}
            # For push to main branch
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' }}
            # For releases
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            # For manual dispatch
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            # Git SHA for traceability
            type=sha,prefix=sha-

      # Cache scope includes version hash to bust cache when version changes
      - name: Generate cache key
        id: cache-key
        run: |
          # Include version and key dependency files in cache scope
          CACHE_SCOPE="codewiki-${{ steps.version.outputs.version }}-${{ hashFiles('pyproject.toml', 'requirements.txt') }}"
          echo "scope=$CACHE_SCOPE" >> $GITHUB_OUTPUT
          echo "Cache scope: $CACHE_SCOPE"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use scoped cache that includes version - busts cache when version changes
          cache-from: type=gha,scope=${{ steps.cache-key.outputs.scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.cache-key.outputs.scope }}
          platforms: linux/amd64,linux/arm64
          # Pass version as build arg for cache busting if needed
          build-args: |
            CODEWIKI_VERSION=${{ steps.version.outputs.version }}
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}

      - name: Verify built image version
        run: |
          echo "=== Verifying CodeWiki version in built image ==="
          # Pull the just-built image (amd64 only for verification)
          docker pull --platform linux/amd64 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}
          # Check version
          BUILT_VERSION=$(docker run --rm --entrypoint "" ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7} sh -c "codewiki --version" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "Built image version: $BUILT_VERSION"
          echo "Expected version: ${{ steps.version.outputs.version }}"
          if [ "$BUILT_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Version mismatch! Built: $BUILT_VERSION, Expected: ${{ steps.version.outputs.version }}"
            exit 1
          fi
          echo "Version verified successfully!"

      - name: Generate image summary
        run: |
          echo "## Docker Image Published :whale:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**CodeWiki Version:** \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Usage:**" >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          echo "# In Bitbucket Pipelines" >> $GITHUB_STEP_SUMMARY
          echo "image: ghcr.io/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Or run locally" >> $GITHUB_STEP_SUMMARY
          echo "docker run --rm -v \$(pwd):/workspace ghcr.io/${{ env.IMAGE_NAME }}:latest analyze --repo /workspace" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
